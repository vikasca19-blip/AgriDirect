<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriDirect - Your Cart</title>

  <style>
    body {
      margin: 0;
      font-family: "Poppins", Arial, sans-serif;
      background-color: #f1f3f6;
    }

    .cart-container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ADDRESS SECTION */
    .address-section {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .address-info h3 {
      margin: 0;
      color: #2c9869;
    }

    .address-actions button {
      background: #2c9869;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 10px;
    }

    /* CART MAIN AREA */
    .cart-main {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .cart-items {
      flex: 2;
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .cart-item-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .cart-item-left img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .remove-btn {
      background: #c0392b;
      color: #fff;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 6px;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty-btn {
      border: 1px solid #aaa;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      background: #eee;
    }

    .item-total {
      color: #2c9869;
      font-size: 18px;
      font-weight: bold;
    }

    .order-summary {
      flex: 1;
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .checkout-btn {
      width: 100%;
      background: #fb641b;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-size: 17px;
      cursor: pointer;
      margin-top: 20px;
    }

    /* PAYMENT SELECTION STYLING */
    .order-summary-payment {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    .payment-option {
      display: flex;
      align-items: center;
      padding: 12px;
      background: #ffffff;
      border-radius: 8px;
      border: 1px solid #ccc;
      cursor: pointer;
      gap: 10px;
    }

    .payment-option.selected {
      border: 2px solid #2c9869;
      background: #e8f6ef;
    }

    .pay-text {
      font-size: 16px;
      font-weight: 500;
    }

    /* POPUP MESSAGE */
    #popupMsg {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #2c9869;
      padding: 12px 18px;
      color: #fff;
      border-radius: 8px;
      display: none;
      font-size: 15px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      z-index: 1000;
    }
  </style>
</head>

<body>

  <div id="popupMsg">Added to cart</div>

  <div class="cart-container">

    <!-- ADDRESS BOX -->
    <div class="address-section">
      <div class="address-info">
        <h3>Delivery Address</h3>
        <p id="addressText">Loading...</p>
      </div>
      <div class="address-actions">
        <button onclick="openChangeAddress()">Change</button>
        <button onclick="openAddAddress()">Add New</button>
      </div>
    </div>

    <!-- CART ITEMS + PRICE -->
    <div class="cart-main">

      <div class="cart-items" id="cartItems"></div>

      <div class="order-summary">
        <h2 style="color:#2c9869;">PRICE DETAILS</h2>

        <p>Subtotal: ₹<span id="subtotal">0</span></p>
        <p>Discount: ₹<span id="discount">0</span></p>

        <h3>Total: ₹<span id="total">0</span></h3>

        <button onclick="window.location.href='index.html'" style="background:#2c9869;color:#fff;border:none;border-radius:6px;
               padding:12px;width:100%;font-size:16px;margin-bottom:15px;">
          ← Continue Shopping
        </button>

        <!-- PAYMENT METHODS -->
        <h3 style="margin-top:20px;">Select Payment Method</h3>

        <div id="paymentMethods" class="order-summary-payment" role="radiogroup">

          <label class="payment-option" data-value="UPI">
            <input type="radio" name="payment" value="UPI" hidden>
            <span class="icon">💰</span>
            <span>UPI / Google Pay / PhonePe</span>
          </label>

          <label class="payment-option" data-value="Card">
            <input type="radio" name="payment" value="Card" hidden>
            <span class="icon">💳</span>
            <span>Debit / Credit Card</span>
          </label>

          <label class="payment-option" data-value="Cash on Delivery">
            <input type="radio" name="payment" value="Cash on Delivery" hidden>
            <span class="icon">📦</span>
            <span>Cash on Delivery</span>
          </label>

        </div>


        <button class="checkout-btn" onclick="proceedToPayment()">Proceed to Payment</button>
      </div>

    </div>
  </div>

  <script>

    // Load cart & user
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    let user = JSON.parse(localStorage.getItem("loggedInUser")) || {};

    document.getElementById("addressText").textContent =
      user.address || "No address saved.";

    // API Config
    const API_URL = 'http://localhost:3000/api';

    // Save order function (API)
    async function saveOrder(paymentMode) {
      const user = JSON.parse(localStorage.getItem("loggedInUser"));
      if (!user) return alert("Please login first!");

      const orderData = {
        username: user.username,
        items: cart.map(item => ({
          name: item.name,
          quantity: item.quantity,
          price: item.price,
          farmer: item.farmer_username || item.farmer || "Unknown"
        })),
        total: cart.reduce((s, i) => s + i.price * i.quantity, 0)
      };

      try {
        const response = await fetch(`${API_URL}/orders`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderData)
        });
        const result = await response.json();

        if (result.success) {
          // Clear cart
          cart = [];
          localStorage.setItem("cart", JSON.stringify([]));
          renderCart();
          updateCartCount();
          showPopup("Order placed successfully!");
        } else {
          alert("Failed to place order: " + result.error);
        }
      } catch (error) {
        console.error("Error placing order:", error);
        alert("Error placing order");
      }
    }

    // Render cart UI
    function renderCart() {
      const container = document.getElementById("cartItems");
      container.innerHTML = "";

      if (cart.length === 0) {
        container.innerHTML = `
      <div style="text-align:center; padding:40px;">
        <p style="font-size:18px; color:#555;">🛒 Your cart is empty.</p>
        <button onclick="window.location.href='index.html'"
                style="margin-top:15px;padding:12px 20px;background:#2c9869;color:#fff;
                       border:none;border-radius:6px;cursor:pointer;font-size:16px;">
          ← Continue Shopping
        </button>
      </div>
    `;
        return;
      }

      let subtotal = 0;

      cart.forEach((item, i) => {
        subtotal += item.price * item.quantity;

        const div = document.createElement("div");
        div.className = "cart-item";
        div.innerHTML = `
      <div class="cart-item-left">
        <img src="${item.image || item.img}" alt="${item.name}">
        <div>
          <h3>${item.name}</h3>
          <p>₹${item.price}</p>
          <div class="quantity-controls">
            <button class="qty-btn" onclick="changeQty(${i}, -1)">−</button>
            <span>${item.quantity}</span>
            <button class="qty-btn" onclick="changeQty(${i}, 1)">+</button>
          </div>
          <button class="remove-btn" onclick="removeFromCart(${i})">Remove</button>
        </div>
      </div>
      <div class="item-total">₹${(item.price * item.quantity).toFixed(2)}</div>
    `;

        container.appendChild(div);
      });

      const discount = subtotal > 500 ? 50 : 0;

      document.getElementById("subtotal").textContent = subtotal;
      document.getElementById("discount").textContent = discount;
      document.getElementById("total").textContent = subtotal - discount;

      localStorage.setItem("cart", JSON.stringify(cart));
    }

    // Qty change
    function changeQty(i, d) {
      cart[i].quantity += d;
      if (cart[i].quantity <= 0) cart.splice(i, 1);

      localStorage.setItem("cart", JSON.stringify(cart));
      renderCart();
      updateCartCount();
    }

    function removeFromCart(i) {
      cart.splice(i, 1);
      localStorage.setItem("cart", JSON.stringify(cart));
      renderCart();
      updateCartCount();
    }

    // Proceed button
    function proceedToPayment() {
      if (!user) return alert("⚠️ Please login first!");
      if (!user.address) return alert("⚠️ Please add your delivery address!");
      if (cart.length === 0) return alert("⚠️ Your cart is empty!");

      const paymentSelected = document.querySelector('.order-summary-payment input[name="payment"]:checked');
      if (!paymentSelected) return alert("⚠️ Please select a payment method!");

      saveOrder(paymentSelected.value);
    }

    function updateCartCount() {
      const count = cart.reduce((t, i) => t + i.quantity, 0);
      localStorage.setItem("cartCount", count);
    }

    function showPopup(msg) {
      const box = document.getElementById("popupMsg");
      box.textContent = msg;
      box.style.display = "block";
      setTimeout(() => box.style.display = "none", 1500);
    }

    renderCart();
    updateCartCount();

    /* PAYMENT SELECTION WORKING */
    const paymentRows = document.querySelectorAll(".payment-option");

    paymentRows.forEach(row => {
      row.addEventListener("click", () => {
        paymentRows.forEach(r => r.classList.remove("selected"));
        row.classList.add("selected");
        row.querySelector("input[type='radio']").checked = true;
      });
    });
  </script>

</body>

</html>
